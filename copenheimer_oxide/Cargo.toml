[package]
name = "copenheimer_oxide"
version = "5.8.0"
edition = "2021"
authors = ["juancartek"]
description = "Ultra-fast Minecraft server scanner written in Rust"
repository = "https://github.com/juancartek/1ueloke"
license = "MIT"
keywords = ["minecraft", "scanner", "network", "security"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.0"
dns-lookup = "2.0"
indicatif = "0.17"
futures = "0.3"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json"] }

# Optional database support
mongodb = { version = "2.8", optional = true }

[features]
default = []
mongodb = ["dep:mongodb"]
full = ["mongodb"]

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
